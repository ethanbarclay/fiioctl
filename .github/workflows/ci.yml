name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # a new push to a branch supersedes the run already in flight
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The suite needs neither a device nor the network: the HID layer is stubbed
    # and the catalogue and AutoEq calls are patched out. So every job here is
    # pure CPU and runs anywhere.
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # prove the other two platforms still import and pass, without
          # multiplying the whole matrix by three
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q

      - name: Commands that need no device
        shell: bash
        run: |
          fiioctl --help > /dev/null
          fiioctl schema | python -c "import json,sys; json.load(sys.stdin)"
          fiioctl --dry-run peq set 0 --freq 105 --gain 5.5 --q 0.7 --filter low-shelf

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: python -m ruff check --output-format github .

  build:
    name: build the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - name: Check metadata renders on PyPI
        run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

name: CI

on:
  # Push is filtered to main on purpose. A branch with an open pull request is
  # already covered by the pull_request trigger, so listening for both would run
  # the whole matrix twice for every push to a PR branch. A branch with no PR
  # yet can be run on demand through workflow_dispatch.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # a new push to a branch supersedes the run already in flight
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The suite needs neither a device nor the network: the HID layer is stubbed
    # and the catalogue and AutoEq calls are patched out. So every job here is
    # pure CPU and runs anywhere.
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # prove the other two platforms still import and pass, without
          # multiplying the whole matrix by three
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q

      - name: Commands that need no device
        shell: bash
        run: |
          fiioctl --help > /dev/null
          fiioctl schema | python -c "import json,sys; json.load(sys.stdin)"
          fiioctl --dry-run peq set 0 --freq 105 --gain 5.5 --q 0.7 --filter low-shelf

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: python -m ruff check --output-format github .

  build:
    name: build the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - name: Check metadata renders on PyPI
        run: python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  smoke:
    # `pip install -e .` in the test job cannot catch packaging mistakes: a
    # module left out of the wheel, a broken console script, missing metadata.
    # So install the real artifact into an otherwise empty environment and run
    # the commands that need no device.
    name: install the wheel (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Install the wheel, with no extras
        shell: bash
        run: python -m pip install "$(ls dist/*.whl)"

      - name: The console script works
        shell: bash
        run: |
          fiioctl --version
          fiioctl --help > /dev/null
          fiioctl schema | python -c "import json,sys; json.load(sys.stdin)"
          fiioctl --dry-run set eq-gain -6

      - name: Every module imports without the optional extras
        shell: bash
        run: |
          python -c "import fiioctl, fiioctl.cli, fiioctl.proto, fiioctl.registry"
          python -c "import fiioctl.device, fiioctl.eqdb, fiioctl.curve"

      - name: A missing extra is explained, not a traceback
        shell: bash
        run: |
          out=$(fiioctl ui 2>&1 || true)
          echo "$out"
          case "$out" in
            *"pip install"*) echo "ok: pointed at the extra" ;;
            *) echo "expected a hint about installing the ui extra"; exit 1 ;;
          esac

      - name: The declared version matches the artifact
        shell: bash
        run: >-
          python -c "import fiioctl;
          from importlib.metadata import version;
          assert version('fiioctl') == fiioctl.__version__, 'version drifted';
          print('version', fiioctl.__version__)"

  coverage:
    # Not a gate. There is no threshold to argue with and a drop fails nothing;
    # the number and the missing lines go to the run summary so a pull request
    # can be judged on what it left untested.
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: Measure
        run: >-
          python -m pytest -q --cov=fiioctl
          --cov-report=term-missing:skip-covered
          --cov-report=markdown
      - name: Report
        if: always()
        run: cat coverage.md >> "$GITHUB_STEP_SUMMARY"

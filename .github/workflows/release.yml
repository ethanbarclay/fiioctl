name: release

# Cutting a release is pushing a tag. Everything else is automatic, and the
# order matters: PyPI first, because a GitHub release can be deleted and
# recreated while a PyPI version number can never be reused.
on:
  push:
    tags: ["v*"]
  # Dispatch exists to re-run a release whose publish step failed. It must be
  # dispatched against the tag, never a branch: every job below refuses a
  # non-tag ref, because a branch happens to be able to carry a name like
  # v0.1.0 and would otherwise sail through the version check and publish
  # whatever that branch holds.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build and check the artifacts
    runs-on: ubuntu-latest
    # Signing the provenance below needs an OIDC token and somewhere to record
    # the attestation. Job-level permissions replace the top-level ones, so
    # contents: read is restated.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - run: python -m pip install build twine

      # Two ways to publish the wrong thing, both unfixable after upload: a
      # tag cut from the wrong commit, and a ref that is not a tag at all.
      # Refuse both here, before any artifact exists.
      - name: The ref is a tag, and it matches the packaged version
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "refusing: $GITHUB_REF_NAME is a $GITHUB_REF_TYPE, not a tag"
            exit 1
          fi
          tag="${GITHUB_REF_NAME#v}"
          packaged=$(python -c "import fiioctl; print(fiioctl.__version__)")
          echo "tag=$tag packaged=$packaged"
          test "$tag" = "$packaged"

      - run: python -m build
      - name: Metadata renders on PyPI
        run: python -m twine check dist/*

      # Provenance is signed here, before anything is published, so a failure
      # stops the release while it can still be retried. The bundle travels as
      # its own artifact because the PyPI step uploads everything in dist/.
      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Name the bundle for the release
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          mkdir provenance
          cp "$BUNDLE" "provenance/fiioctl-${GITHUB_REF_NAME#v}.intoto.jsonl"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: provenance
          path: provenance/

  smoke:
    name: install the wheel before publishing it
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Install and run
        shell: bash
        run: |
          python -m pip install "$(ls dist/*.whl)"
          fiioctl --version
          fiioctl schema | python -c "import json,sys; json.load(sys.stdin)"

  pypi:
    name: publish to PyPI
    needs: smoke
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    # Trusted publishing: PyPI verifies this workflow's OIDC token, so there is
    # no API token in the repository secrets to leak or rotate. Configured once
    # on pypi.org as a pending publisher for owner/repo/release.yml/environment.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    name: publish the GitHub release
    needs: pypi
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: provenance
          path: provenance
      - name: Create the release with the wheel, sdist and provenance attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/* provenance/*
          --verify-tag --generate-notes
          --title "$GITHUB_REF_NAME"

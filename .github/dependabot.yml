version: 2
updates:
  # The one that earns its keep here. Actions go stale quietly: the runners are
  # already warning that checkout@v4 and setup-python@v5 target Node 20, and
  # nothing in the repo would have told us.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ":arrow_up:"
    labels: [dependencies]

  # Dependencies here are floors (`hidapi>=0.15`) rather than pins, so there is
  # usually nothing for this to do - it will mostly act on the dev extras, and
  # on anything pinned later.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: ":arrow_up:"
    labels: [dependencies]
